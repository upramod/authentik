name: Validate SCIM membership safety (fork only)

on:
  pull_request:
    branches:
      - validation/scim-membership-20261015
    paths:
      - "authentik/lib/sync/outgoing/tasks.py"
      - "authentik/providers/scim/**"
      - ".github/workflows/validate-scim-membership.yml"

permissions:
  contents: read

jobs:
  scim-focused:
    name: SCIM tests (PostgreSQL ${{ matrix.psql }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        psql:
          - 14-alpine
          - 18-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Setup authentik test environment
        uses: ./.github/actions/setup
        with:
          postgresql_version: ${{ matrix.psql }}
      - name: Focused SCIM tests
        run: uv run make test authentik/providers/scim
      - name: Formatting and lint
        run: |
          uv run black --check authentik/lib/sync/outgoing/tasks.py authentik/providers/scim/clients/users.py authentik/providers/scim/tests/test_membership.py
          uv run ruff check authentik/lib/sync/outgoing/tasks.py authentik/providers/scim/clients/users.py authentik/providers/scim/tests/test_membership.py
