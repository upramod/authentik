name: Validate SCIM partial-response fix
on:
  push:
    branches: [validation/scim-partial-response-20260929]
permissions:
  contents: read
jobs:
  scim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "EK-5jnKfjrGRm<77"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24b53029729ccfc5bda1267b0dd4ed856544a819
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          dependencies: python,runtime
      - name: Check formatting and lint
        run: |
          uv run black --check authentik/providers/scim/clients/users.py authentik/providers/scim/tests/test_user.py
          uv run ruff check authentik/providers/scim/clients/users.py authentik/providers/scim/tests/test_user.py
      - name: Full SCIM suite
        run: |
          set -o pipefail
          mkdir -p evidence
          make test authentik/providers/scim 2>&1 | tee evidence/scim.log
      - name: Provenance
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          uv run python --version >> evidence/source.txt
          cp unittest.xml evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scim-partial-response-fix
          path: evidence/
